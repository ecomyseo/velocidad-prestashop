# Entregar banner.png.webp en la URL de banner.png al navegador que acepta WebP (Vary: Accept).
# Para servidores con nginx delante de Apache (Hestia, Plesk con estáticos en nginx, VPS propios), donde la regla del
# .htaccess NO se aplica porque nginx sirve la imagen sin pasar por Apache.
#
# 1) En el bloque http {} (p. ej. /etc/nginx/conf.d/webp-sufijo.conf), una sola vez por servidor:

map $http_accept $webp_sufijo {
    default        "";
    "~*image/webp" ".webp";
}

# 2) Dentro del server {} del dominio (en Hestia: /home/USUARIO/conf/web/DOMINIO/nginx.ssl.conf_webp, que la
#    plantilla incluye al final). Una location por carpeta de imágenes subidas. Sustituir RAIZ por la raíz de la web.
#
#    Por qué ^~ : las plantillas de los paneles traen una location con expresión regular para los estáticos
#    (location ~* ^.+\.(jpg|png|...)$). Una location con expresión regular gana a cualquier location normal añadida al
#    final; con ^~ se gana a las expresiones regulares.
#
#    Por qué el try_files final a @fallback: todo lo que no sea imagen (un index.php, por ejemplo) sigue yendo a Apache
#    como antes. Nunca se sirve un PHP como texto. Comprobar que la plantilla del dominio tiene esa location @fallback
#    (Hestia sí); si se llama de otra forma, poner su nombre.

#    Se prueban los dos nombres de WebP que se usan: banner.png.webp (scripts/webp_al_lado.py) y banner.webp (el
#    módulo ecom_webpauto). OJO: con una captura numérica ($1) NO funciona: al evaluar el map con expresión regular,
#    nginx sobrescribe $1 y «$1$webp_sufijo» se queda en «.webp». Por eso la captura lleva nombre (?<webp_base>...).

location ^~ /img/cms/ {
    location ~* ^(?<webp_base>.+)\.(png|jpe?g)$ {
        root       RAIZ;
        expires    max;
        add_header Vary Accept;
        try_files  $uri$webp_sufijo $webp_base$webp_sufijo $uri @fallback;
    }
    location ~ /\. { deny all; }
    location ~* \.(gif|webp|svg|avif|ico|pdf|css|js|woff2?|ttf|mp4|webm)$ {
        root       RAIZ;
        expires    max;
        try_files  $uri @fallback;
    }
    try_files /webp-no-existe @fallback;
}

# Repetir el bloque para cada carpeta: /modules/ps_imageslider/images/, /modules/<modulo-de-banners>/images/,
# la carpeta de subidas del tema, etc.
#
# 3) Comprobar y recargar:  nginx -t && systemctl reload nginx
# 4) Probar:  curl -sI -H "Accept: image/webp" https://DOMINIO/img/cms/banner.png   -> Content-Type: image/webp
#             curl -sI https://DOMINIO/img/cms/banner.png                          -> Content-Type: image/png
#             y una URL que no sea imagen de esa carpeta (index.php) debe responder igual que antes.
# Copiar las directivas (access_log, expires...) de la location de estáticos de la plantilla del dominio, para que
# las imágenes se sigan registrando igual.
